name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a leading v
        required: true
        default: 0.1.0
      publish_release:
        description: Create a GitHub Release after the artifacts build
        type: boolean
        required: true
        default: false
      draft:
        description: Create the manually published release as a draft
        type: boolean
        required: true
        default: true
      prerelease:
        description: Mark the manually published release as a prerelease
        type: boolean
        required: true
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-installer:
    name: Windows Installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set release version
        id: version
        shell: pwsh
        run: |
          $eventName = '${{ github.event_name }}'
          $refName = '${{ github.ref_name }}'
          $inputVersion = '${{ github.event.inputs.version }}'

          if ($eventName -eq 'workflow_dispatch' -and $inputVersion) {
            $version = $inputVersion
          } else {
            $version = $refName -replace '^v', ''
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "release_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build Windows installer
        run: wails build -platform windows/amd64 -nsis

      - name: Name Windows installer artifact
        shell: pwsh
        run: |
          $source = 'build\bin\StreamSignal-amd64-installer.exe'
          $target = "build\bin\StreamSignal-$env:RELEASE_VERSION-windows-amd64-installer.exe"

          if (!(Test-Path $source)) {
            throw "Expected installer was not created at $source"
          }

          Copy-Item -Path $source -Destination $target

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: streamsignal-${{ steps.version.outputs.release_version }}-windows-amd64-installer
          path: build/bin/StreamSignal-${{ steps.version.outputs.release_version }}-windows-amd64-installer.exe
          if-no-files-found: error
          retention-days: 14

  macos-dmg:
    name: macOS DMG
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${{ github.ref_name }}"
            version="${version#v}"
          fi

          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "release_version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build macOS app bundle
        run: wails build -platform darwin/universal

      - name: Create macOS DMG
        run: |
          app_path="build/bin/StreamSignal.app"
          dmg_path="build/bin/StreamSignal-${RELEASE_VERSION}-macos-universal.dmg"

          if [ ! -d "$app_path" ]; then
            echo "Expected app bundle was not created at $app_path" >&2
            exit 1
          fi

          hdiutil create -volname "StreamSignal" -srcfolder "$app_path" -ov -format UDZO "$dmg_path"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: streamsignal-${{ steps.version.outputs.release_version }}-macos-universal-dmg
          path: build/bin/StreamSignal-${{ steps.version.outputs.release_version }}-macos-universal.dmg
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - windows-installer
      - macos-dmg
    if: github.event_name == 'push' || github.event.inputs.publish_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set release details
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
            tag="v${version#v}"
            draft="${{ github.event.inputs.draft }}"
            prerelease="${{ github.event.inputs.prerelease }}"
          else
            tag="${{ github.ref_name }}"
            version="${tag#v}"
            draft="false"
            prerelease="false"

            if [[ "$version" == *-* ]]; then
              prerelease="true"
            fi
          fi

          echo "release_version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          RELEASE_DRAFT: ${{ steps.release.outputs.draft }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          mapfile -t artifacts < <(find release-artifacts -type f | sort)

          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release artifacts were downloaded." >&2
            exit 1
          fi

          args=(
            "$RELEASE_TAG"
            "${artifacts[@]}"
            --title "StreamSignal $RELEASE_VERSION"
            --notes-file RELEASE_NOTES.md
            --target "$GITHUB_SHA"
          )

          if [ "$RELEASE_DRAFT" = "true" ]; then
            args+=(--draft)
          fi

          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
